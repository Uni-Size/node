name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치지 않게 하나씩 실행
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: SSH 설정
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      # ponytail: EC2에서 직접 빌드(배포 중 수십 초 다운타임). 무중단 필요하면 Actions에서 이미지 빌드 → ECR pull로 전환
      - name: EC2 배포
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} 'set -e
            cd ~/unisize
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f'

      - name: 헬스체크
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://${{ secrets.SITE_ADDRESS }}/api/health && exit 0
            sleep 5
          done
          echo "헬스체크 실패" && exit 1
